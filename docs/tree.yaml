# Дерево документации для страницы /docs/.
#
# Узел — это имя .md-файла (без расширения), либо объект с детьми:
#   - Имя файла                         # лист без подстатей
#   - doc: Имя файла                    # статья с подстатьями
#     children:
#       - Подстатья
#       - doc: Подстатья
#         children: [ ... ]             # глубина любая
#
# Каждый узел — реальный документ. Заголовок берётся из самого файла.
# Документы, которых здесь нет, на странице /docs/ не отображаются (но
# остаются доступны по прямой ссылке и через поиск).

tree: # Оставлены только переписанные или переписываемые в данный момент статьи
  - glossary
  - doc: narration
    children:
      - characters
  - audio
  - screens
  - RKK Project 410

