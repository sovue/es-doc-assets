# Дерево документации для страницы /docs/.
#
# Узел — это имя .md-файла (без расширения), либо объект с детьми:
#   - Имя файла                         # лист без подстатей
#   - doc: Имя файла                    # статья с подстатьями
#     children:
#       - Подстатья
#       - doc: Подстатья
#         children: [ ... ]             # глубина любая
#
# Заголовок статьи берётся из самого файла. Документы, которых здесь нет, на
# странице /docs/ не отображаются (но остаются доступны по прямой ссылке и
# через поиск).
#
# Длинный список можно разбить на группы. Это оформление, а не страницы:
#   - ---                               # разделительная черта
#   - heading: Название группы          # заголовок-подпись без ссылки
#   - heading: Название группы          # ...или с вложенными статьями
#     children:
#       - Статья
#
# Разделители и заголовки работают на любой глубине и одинаково видны и на
# /docs/, и в списке «Все статьи» в боковой панели статьи. Черта, которой
# нечего разделять (в начале, в конце или сразу после другой), не рисуется —
# так группа, все статьи которой не нашлись, не оставляет после себя линию.

tree: # Оставлены только переписанные или переписываемые в данный момент статьи
  - requirements
  - beginning
  - heading: Базовое руководство
