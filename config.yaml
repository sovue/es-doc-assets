# Серверная конфигурация сайта. Файл хранится вместе с контентом, чтобы
# оформление и тексты сайта менялись синхронно со статьями.

# Каждый ключ становится блоком :::name. Для встроенных статусов отдельные
# поля можно опускать; новый статус должен описать все поля.
# title — обычный текст; text — Markdown, если автор не указал свою приписку.
# icon: info, tip, attention, warning, danger, wip, outdated.
# tone: info, tip, attention, warning, danger.
banners:
  stub:
    title: Эта статья — заготовка.
    text: Скоро здесь будет новая статья, мы уже работаем над этим.
    icon: attention
    tone: attention
  wip:
    title: Эта статья сейчас переписывается...
    text: >-
      Над этой статьёй ведётся активная работа: содержимое может измениться
      в любой момент, поэтому не стоит опираться на него как на окончательное.
    icon: wip
    tone: attention
  outdated:
    title: Эта статья устарела!
    text: Она не соответствует нашим стандартам качества и требует ревизии.
    icon: outdated
    tone: warning
  old:
    title: Эту статью не мешало бы обновить!
    text: Она старая и может иметь некоторые неточности, но не требует немедленной ревизии.
    icon: outdated
    tone: info

# Площадки, где проект можно поддержать деньгами. Раздел /support.
support:
  - name: Boosty
    url: https://boosty.to/sovue

# Тексты страниц ошибок принадлежат сайту, а не локальной установке.
http-errors:
  default: Во время загрузки страницы произошла ошибка. Попробуйте повторить запрос позже. Если проблема сохраняется — сообщите администрации.
  400:
    - Плохой запрос.
    - Сервер не смог разпознать запрос, отправленный клиентом.
  403:
    - Доступ запрещён.
    - Доступ к этой странице запрещён. Если вы считаете, что это ошибка — сообщите администрации.
  404:
    - Страница не найдена.
    - Проверьте адрес страницы или вернитесь на главную.
  418:
    - Я чайник.
    - В данный момент сервер является чайником и отказывается варить кофе. Если проблема сохраняется — сообщите администрации.
  500:
    - Внутренняя ошибка сервера.
    - На сервере произошла непредвиденная ошибка. Попробуйте повторить запрос позже. Если проблема сохраняется — сообщите администрации.
  503:
    - Сервис временно недоступен.
    - Сервис перегружен или находится на техническом обслуживании. Попробуйте повторить запрос позже. Если проблема сохраняется — сообщите администрации.
