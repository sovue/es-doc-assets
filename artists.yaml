# Художники, берущие заказы на арт для модов «Бесконечного лета».
# Страница: /artists
#
# Поля художника:
#   name     — имя (как подписывается автор). Обязательно.
#   status   — приём заказов:
#                open     — заказы открыты
#                closed   — заказы закрыты
#                unknown  — не уточнялось (значение по умолчанию)
#   preview  — необязательно. Картинка-пример работы (показывается в галерее
#              и таблице). Например профильный арт или обложка. Если не
#              задано — покажем монограмму. Можно указать двумя способами:
#                - https://... — прямая ссылка. Сайт сам скачает картинку,
#                  перегонит в webp и закэширует у себя (так что даже
#                  ссылки, которые блокирует браузер напрямую, всё равно
#                  показываются).
#                - локальный путь — если картинка скачана и лежит прямо
#                  в этом репозитории, в папке artists/ (создайте её рядом
#                  с game/ и docs/). Путь пишется ОТНОСИТЕЛЬНО ЭТОЙ ПАПКИ
#                  (без "artists/" в начале), например creppylandau/preview.jpg
#                  для файла <репозиторий>/artists/creppylandau/preview.jpg.
#   logo     — необязательно. Аватар/логотип автора. Те же два варианта, что
#              и у preview (ссылка или локальный путь в artists/).
#   links    — ссылки на площадки автора. Ключи произвольные; известные
#              (vk, tg, boosty, discord, twitter, instagram, artstation,
#              behance, youtube, site) получают красивую подпись, любой
#              другой ключ подписывается как есть.
#
# Пример со ссылкой:
#   - name: Пример
#     status: open
#     preview: https://example.com/art.jpg
#     logo: https://example.com/logo.jpg
#     links: { vk: https://vk.com/example, tg: https://t.me/example }
#
# Пример с локальными файлами (лежат в artists/example2/ этого репозитория,
# т.е. в <репозиторий>/artists/example2/preview.jpg и .../logo.webp):
#   - name: Пример2
#     status: open
#     preview: example2/preview.jpg
#     logo: example2/logo.webp
#     links: { vk: https://vk.com/example2 }

