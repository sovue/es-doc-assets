name: CI and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: es-doc-production
      cancel-in-progress: false
    steps:
      - name: Update server and rebuild containers
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail

          : "${DEPLOY_HOST:?DEPLOY_HOST is required}"
          : "${DEPLOY_USER:?DEPLOY_USER is required}"
          : "${DEPLOY_PATH:?DEPLOY_PATH is required}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY is required}"
          : "${DEPLOY_KNOWN_HOSTS:?DEPLOY_KNOWN_HOSTS is required}"

          key_file="${RUNNER_TEMP}/es-doc-deploy-key"
          known_hosts_file="${RUNNER_TEMP}/es-doc-known-hosts"
          install -m 600 /dev/null "${key_file}"
          install -m 600 /dev/null "${known_hosts_file}"
          printf '%s\n' "${DEPLOY_SSH_KEY}" >"${key_file}"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" >"${known_hosts_file}"

          # The remote login shell may be fish; pass the script directly to Bash.
          ssh -i "${key_file}" \
            -o UserKnownHostsFile="${known_hosts_file}" \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=12 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -se' <<DEPLOY
          set -Eeuo pipefail
          cd -- $(printf '%q' "${DEPLOY_PATH}")
          cd ..
          cd es-doc-assets
          git checkout main
          git fetch origin main
          git reset --hard origin/main
          git pull
          cd ..
          cp -r ./es-doc-assets/* es-doc/content/
          cd es-doc
          # Serialize application and assets deployments across both repositories.
          exec 9>.deploy.lock
          flock -x 9
          git checkout main
          git fetch origin main
          git reset --hard origin/main
          git pull
          set -Eeuo pipefail
          # Bind mounts retain host permissions; app must read static files and templates.
          chmod -R a+rX ./static ./templates
          docker compose --env-file .env.production -f docker-compose.yml up -d --build --force-recreate --wait --wait-timeout 180 || {
            docker compose --env-file .env.production -f docker-compose.yml logs --tail=100
            exit 1
          }
          DEPLOY
