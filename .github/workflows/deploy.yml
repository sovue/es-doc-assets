name: Deploy assets

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Update site assets
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: es-doc-assets-production
      cancel-in-progress: false
    steps:
      - name: Update content volume on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          ASSETS_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          : "${DEPLOY_HOST:?DEPLOY_HOST is required}"
          : "${DEPLOY_USER:?DEPLOY_USER is required}"
          : "${DEPLOY_PATH:?DEPLOY_PATH is required}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY is required}"
          : "${DEPLOY_KNOWN_HOSTS:?DEPLOY_KNOWN_HOSTS is required}"
          [[ "${ASSETS_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid assets commit SHA' >&2; exit 1; }

          key_file="${RUNNER_TEMP}/es-doc-deploy-key"
          known_hosts_file="${RUNNER_TEMP}/es-doc-known-hosts"
          install -m 600 /dev/null "${key_file}"
          install -m 600 /dev/null "${known_hosts_file}"
          printf '%s\n' "${DEPLOY_SSH_KEY}" >"${key_file}"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" >"${known_hosts_file}"

          # The remote login shell may be fish; pass the script directly to Bash.
          ssh -i "${key_file}" \
            -o UserKnownHostsFile="${known_hosts_file}" \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=12 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -se' <<DEPLOY
          set -Eeuo pipefail
          cd -- $(printf '%q' "${DEPLOY_PATH}")
          # Serialize application and assets deployments across both repositories.
          exec 9>.deploy.lock
          flock -x 9

          docker compose --env-file .env.production -f docker-compose.yml config --volumes | grep -Fxq es-doc-content || {
            echo 'Deploy the es-doc content-volume commit before updating assets.' >&2
            exit 1
          }

          docker compose --env-file .env.production -f docker-compose.yml run --rm --no-deps --user root --entrypoint bash -e ASSETS_REF=${ASSETS_SHA} web -se <<'ASSETS'
          set -Eeuo pipefail
          # This updates the shared content volume, not the application image.
          git -c safe.directory=/app/content -C /app/content init -q -b "\${ASSETS_BRANCH}"
          if git -c safe.directory=/app/content -C /app/content remote get-url origin >/dev/null 2>&1; then
            test "\$(git -c safe.directory=/app/content -C /app/content remote get-url origin)" = "\${ASSETS_REPO}"
          else
            git -c safe.directory=/app/content -C /app/content remote add origin "\${ASSETS_REPO}"
          fi
          git -c safe.directory=/app/content -C /app/content fetch --depth=1 origin "\${ASSETS_REF}"
          git -c safe.directory=/app/content -C /app/content reset --hard FETCH_HEAD
          git -c safe.directory=/app/content -C /app/content checkout -B "\${ASSETS_BRANCH}"
          git -c safe.directory=/app/content -C /app/content update-ref "refs/remotes/origin/\${ASSETS_BRANCH}" HEAD
          git -c safe.directory=/app/content -C /app/content branch --set-upstream-to="origin/\${ASSETS_BRANCH}"
          chown -R app:app /app/content
          ASSETS

          docker compose --env-file .env.production -f docker-compose.yml up -d --no-build --force-recreate --wait --wait-timeout 180 || {
            docker compose --env-file .env.production -f docker-compose.yml logs --tail=100
            exit 1
          }
          DEPLOY
