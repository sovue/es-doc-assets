name: Deploy assets

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Rebuild site with updated assets
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: es-doc-assets-production
      cancel-in-progress: false
    steps:
      - name: Rebuild containers on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          ASSETS_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          : "${DEPLOY_HOST:?DEPLOY_HOST is required}"
          : "${DEPLOY_USER:?DEPLOY_USER is required}"
          : "${DEPLOY_PATH:?DEPLOY_PATH is required}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY is required}"
          : "${DEPLOY_KNOWN_HOSTS:?DEPLOY_KNOWN_HOSTS is required}"
          [[ "${ASSETS_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid assets commit SHA' >&2; exit 1; }

          key_file="${RUNNER_TEMP}/es-doc-deploy-key"
          known_hosts_file="${RUNNER_TEMP}/es-doc-known-hosts"
          install -m 600 /dev/null "${key_file}"
          install -m 600 /dev/null "${known_hosts_file}"
          printf '%s\n' "${DEPLOY_SSH_KEY}" >"${key_file}"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" >"${known_hosts_file}"

          ssh -i "${key_file}" \
            -o UserKnownHostsFile="${known_hosts_file}" \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -e; cd '${DEPLOY_PATH}'; \
            docker compose --env-file .env.production -f compose.production.yaml build --build-arg ASSETS_REF=${ASSETS_SHA} web; \
            docker compose --env-file .env.production -f compose.production.yaml up -d --no-build --wait --wait-timeout 180 || \
            { docker compose --env-file .env.production -f compose.production.yaml logs --tail=100; exit 1; }"
