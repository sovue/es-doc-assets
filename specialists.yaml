# Специалисты для модов «Бесконечного лета» — страница /specialists.
# Все участники и примеры работ хранятся в этом файле.
#
# Обязательные поля: name, categories.
# categories: artists / ai-artists / coders / composers / writers.
# У одного специалиста может быть несколько категорий.
# status: open / closed / unknown (по умолчанию unknown).
# links: контакты и площадки автора, например vk, tg, github, site.
# tg / telegram: "@username", https://t.me/username, tg://resolve?domain=username
# или tg://user?id=123456789 (числовой ID). Username в параметре id
# преобразуется в https://t.me/username. Значение с @ заключайте в кавычки.
# logo: прямая http(s)-ссылка или путь относительно specialists/.
# works: примеры работ, у каждого type, title и url либо file.
#
# Типы примеров:
#   artists, ai-artists — art (арт / изображение)
#   composers — track (прямой аудиофайл, показываются не более двух)
#   coders — mod, project
#   writers — mod, fanfic
#
# Изображения и треки можно положить в папку specialists/ рядом с docs/:
# file указывается относительно этой папки, без specialists/ в начале.
# Для модов, проектов и фанфиков используйте url страницы работы.
# Примеры ниже только описывают формат и не появляются на сайте.
#
# - name: Имя художника
#   categories: [artists]
#   status: open
#   links: {vk: "https://vk.com/example"}
#   works:
#     - {type: art, title: Лагерь вечером, file: example/camp.webp}
#
# - name: Имя нейрохудожника
#   categories: [ai-artists]
#   works:
#     - {type: art, title: Авторский фон, url: "https://example.com/background.webp"}
#
# - name: Имя композитора
#   categories: [composers]
#   status: open
#   links: {tg: "https://t.me/example"}
#   works:
#     - {type: track, title: Тема лагеря, file: example/camp.ogg}
#     - {type: track, title: Ночной трек, url: "https://example.com/night.mp3"}
#
# - name: Имя автора
#   categories: [coders, writers]
#   links: {github: "https://github.com/example"}
#   works:
#     - {type: mod, title: Название мода, url: "https://example.com/mod"}
#     - {type: project, title: Название проекта, url: "https://example.com/project"}
#     - {type: fanfic, title: Название фанфика, url: "https://example.com/story"}

