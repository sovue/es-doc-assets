# Специалисты для модов «Бесконечного лета» — страница /specialists.
# Каждый раздел содержит отдельные профили своей категории.
# Один человек может быть указан в нескольких разделах: статус, контакты,
# описание, превью и примеры работ у таких профилей независимы.
#
# Обязательное поле профиля: name.
# status: open / closed / unknown (по умолчанию unknown).
# links: контакты и площадки автора, например vk, tg, github, site.
# tg / telegram: "@username", https://t.me/username, tg://resolve?domain=username
# или tg://user?id=123456789 (числовой ID). Username в параметре id
# преобразуется в https://t.me/username. Значение с @ заключайте в кавычки.
# logo: необязательный аватар — http(s)-ссылка или путь относительно specialists/.
# Без logo или при ошибке загрузки аватара показывается первая буква имени.
# preview: необязательное изображение карточки, задаётся отдельно от works.
# description: необязательный текст профиля (многострочный текст: |).
# Без preview показывается заглушка с первой буквой имени; без description
# блок описания не показывается и не занимает места.
# works: примеры работ, у каждого type, необязательный title и url либо file.
# Превью не выбирается из works и не добавляется в примеры автоматически.
#
# Типы примеров:
#   artists, ai-artists — art (арт / изображение)
#   coders — mod, project
#   composers — track (прямой аудиофайл, показываются не более двух)
#   writers — mod, fanfic
#
# Все локальные файлы хранятся в папке specialists/ репозитория ассетов.
# В url, file, logo и preview укажите путь относительно неё, без specialists/.
# Например teromioset/preview.jpg доступен по /specialists/res/teromioset/preview.jpg.
# Поддерживаются http(s)-ссылки и ссылки от корня сайта, например /redirect/github.
#
# Пример отдельного профиля (не появляется на сайте):
# specialists:
#   artists:
#     - name: Имя автора
#       status: open
#       preview: example/camp.webp
#       description: Рисую фоны и персонажей.
#       links: {vk: "https://vk.com/example"}
#       works:
#         - {type: art, title: Лагерь вечером, url: example/camp.webp}
#   composers:
#     - name: Имя автора
#       status: closed
#       works:
#         - {type: track, title: Тема лагеря, file: example/camp.ogg}

