# Описания ресурсов для вкладки «Ресурсы» на сайте — единственный файл,
# который нужно править. Формат: <имя>: '<описание>'.
# Пустое значение — на сайте будет «Описание уточняется.»
# Для фонов (bg) и музыки (music) значения предзаполнены автоматически,
# их можно свободно переписывать; пустое значение вернёт автоописание.
# Необъявленные файлы перечислены в конце секций (ключ — имя файла без
# расширения); их пустое значение — «Не объявлен в игре…».

