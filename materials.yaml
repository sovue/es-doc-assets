# Материалы по программированию и писательскому мастерству. Раздел /materials.
#
# Раздел может содержать материалы и вложенные разделы:
#   - name: Название категории
#     items:
#       - title: Название материала
#         url: Прямая ссылка на чтение (необязательно)
#         url_label: Читать онлайн (необязательно — иначе ссылка в названии)
#         access: Полный текст или Фрагмент (необязательно)
#         files: Список путей относительно materials/ или объектов {path, label}
#         description: Краткое пояснение (необязательно)
#     sections:
#       - name: Вложенный раздел
#         items: ...

categories:
  - name: Программирование
    sections:
      - name: Ren'Py
        items:
          - title: Документация Ren'Py (на русском)
            url: https://vgtuemgav.github.io/Renpy-doc-Rus/
            description: Документация на русском.
          - title: Документация Ren'Py
            url: https://www.renpy.org/doc/html/
            description: Оригинальная документация.
      - name: Полезные инструменты
        items:
          - title: Action Editor
            url: https://github.com/kyouryuukunn/renpy-ActionEditor3
            description: >-
              Визуальный редактор. Позволяет настроить сцену прямо в игре и скопировать готовый код.
          - title: Галерея мододела
            url: https://steamcommunity.com/sharedfiles/filedetails/?id=2433461897
            description: >-
              Конструктор сцен для «Бесконечного лета».
          - title: Road to Glory for Modmakers
            url: https://steamcommunity.com/sharedfiles/filedetails/?id=617591839
            description: >-
              Обучающий мод для «Бесконечного лета» с уроками по Ren'Py и Python, а также конструктором сцен.
      - name: Python
        sections:
          - name: Видеолекции
            items:
              - title: «Практика программирования на Python 3» от Тимофея Хирьянова
                url: https://www.youtube.com/playlist?list=PLRDzFCPr95fLuusPXwvOPgXzBL3ZTzybY
                description: >-
                  Бесплатный цикл по Python от (легенды) Тимофея Хирьянова, преподавателя МФТИ. Состоит из 14 лекций.
          - name: Курсы
            items:
              - title: «Поколение Python» курс для начинающих
                url: https://pygen.ru/beginner
                description: >-
                  Бесплатный курс для первого знакомства с Python.
              - title: «Программирование на Python» от института биоинформатики
                url: https://stepik.org/course/67/promo
                description: >-
                  (Для доступа необходимо выключить VPN!) Бесплатный вводный видеокурс, около пяти часов лекций с практикой.
          - name: Книги
            items:
              - title: Майкл Доусон — «Программируем на Python»
                url: https://djvu.online/file/bacIjSel17Ser
                url_label: Читать онлайн
                access: Полный текст
              - title: Эрик Мэтиз — «Изучаем Python»
                url: https://royallib.com/read/metiz_erik/izuchaem_python_programmirovanie_igr_vizualizatsiya_dannih_vebprilogeniya.html
                url_label: Читать онлайн
                access: Полный текст
  - name: Писательское мастерство
    sections:
      - name: Статьи про сюжет
        items:
          - title: Канон «Бесконечного лета» - его особенности, мифы и заблуждения
            url: https://steamcommunity.com/sharedfiles/filedetails/?id=3495950377
      - name: Полезные сайты
        items:
          - title: «Литературная Мастерская» — сборник статей по писательскому мастерству
            url: https://litmasters.ru/category/pisatelskoe-masterstvo
      - name: Книги
        items:
          - title: Нора Галь — «Слово живое и мёртвое»
