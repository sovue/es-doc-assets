            access: Полный текст
          - title: Линда Сегер — «Как хороший сценарий сделать великим»
            url: https://dramafond.ru/wp-content/uploads/2014/11/как_хороший_сценарий_сделать_великим.pdf
            url_label: Читать PDF
            access: Полный текст
          - title: "Роберт Макки — «Диалог: Искусство слова для писателей, сценаристов и драматургов»"
