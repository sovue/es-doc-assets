          - title: "Уильям Индик — «Психология для сценаристов: Построение конфликта в сюжете»"
            url: https://mybook.ru/author/uilyam-indik/psihologiya-dlya-scenaristov-postroenie-konflikta/read/
            url_label: Читать онлайн
            access: Полный текст
