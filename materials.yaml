          - title: Родари Дж. — «Грамматика фантазии»
            url: https://libcat.ru/knigi/detskaya-literatura/prochaya-detskaya-literatura/160838-dzhanni-rodari-grammatika-fantazii-vvedenie-v-iskusstvo-pridumyvaniya-istorij.html
            url_label: Читать онлайн
            access: Полный текст
          - title: Блейк Снайдер — «Спасите котика! И другие секреты сценарного мастерства»
            url: https://libcat.ru/knigi/dokumentalnye-knigi/publicistika/screenplays/140364-blejk-snajder-spasite-kotika-i-drugie-sekrety-scenarnogo-masterstva.html
            url_label: Читать онлайн
